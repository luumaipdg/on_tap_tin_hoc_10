<!DOCTYPE html>

<head>

  }

  }

  p, li, label {

  }

  }

    text-align: center;
  }
  .btn-primary {
    background-color: #40e0d0;

  .btn-primary:disabled {

  .btn-secondary {

    color: #fff;
  }

    border-radius: 10px;
    background: #30475e;

    color: #001f3f;

    gap: 1rem;
    margin-top: 1rem;

    color: #40e0d0;
    font-weight: 700;
  }
  .review-wrong {
    color: #ff6f61;
    font-weight: 700;
  }

    font-style: italic;
    color: #ccc;

    nav ul {

      gap: 0.5rem;

      max-width: 100%;
    }

      width: 2.5rem;
      height: 2.5rem;
      font-size: 20px;
    }

    outline: 3px solid #ff6f61;
    outline-offset: 2px;

    width: 8px;
  }

    background-color: #40e0d0;
    border-radius: 4px;
  }
  /* SVG icon style */
  svg.icon {
    width: 1.5em;
    height: 1.5em;
    vertical-align: middle;

    });
  }

  // Lấy từ ngân hàng, không lặp câu, cân đối vị trí đáp án

  let currentMode = "start"; // start, lesson, quiz, result, review, game

  let answers = []; // array of selected answerIndex or null
  let history = []; // saved attempts

  // Storage keys
  function storageKey(key) {
    if (!currentUser) return null;
    return storagePrefix + currentUser.sessionId + "-" + key;
  }

  // Save history to localStorage
  function saveHistory() {
    if (!currentUser) return;
    try {
      const key = storageKey("history");
      localStorage.setItem(key, JSON.stringify(history));
    } catch(e) {
      alert("Không thể lưu dữ liệu do bộ nhớ trình duyệt bị giới hạn hoặc bị vô hiệu hóa.");
    }
  }

  // Load history from localStorage
  function loadHistory() {
    if (!currentUser) return [];
    try {
      const key = storageKey("history");
      const data = localStorage.getItem(key);
      if (data) return JSON.parse(data);
      return [];
    } catch(e) {
      return [];
    }
  }

  // Save current attempt snapshot
  function saveAttempt() {
    if (!currentUser) return;
    const attempt = {
      id: "att-" + Date.now(),
      datetime: new Date().toISOString(),
      user: {...currentUser},
      lessonId,
      mode: "quiz",
      schemaVersion,
      questions: currentQuizQuestions.map(q => ({
        id: q.id,
        type: q.type,
        question: q.question,
        options: q.options,
        answerIndex: q.answerIndex,
        explanation: q.explanation
      })),
      answers: [...answers],
      score: calculateScore()
    };
    history.push(attempt);
    saveHistory();
  }

  // Calculate score for current answers
  function calculateScore() {
    let correctCount = 0;
    for(let i=0; i<currentQuizQuestions.length; i++) {
      if (answers[i] === currentQuizQuestions[i].answerIndex) correctCount++;
    }
    return Math.round(10 * correctCount / currentQuizQuestions.length * 100) / 100;
  }

  // Validate user input for name and class
  function validateUserInput(name, className) {
    if (!name || !className) return false;
    // Trim and check length
    if (name.trim().length === 0 || className.trim().length === 0) return false;
    return true;
  }

  // Escape user input for display
  function safeText(text) {
    return escapeHTML(text.trim());
  }

      currentUser = {

  // Start quiz: mode = "practice" or "demo"
  function startQuiz(mode) {
    currentMode = "quiz";
    currentQuestionIndex = 0;
    answers = [];
    if (mode === "practice") {
      // Lấy toàn bộ ngân hàng câu hỏi
      currentQuizQuestions = [...questionBank];
    } else if (mode === "demo") {
      // Lấy câu theo ma trận minh họa
      currentQuizQuestions = matrixDemo.questions.map(id => questionBank.find(q => q.id === id)).filter(Boolean);
    }
    // Khởi tạo câu trả lời null
    answers = new Array(currentQuizQuestions.length).fill(null);
    renderQuiz();
  }

  function attachQuizHandlers() {
    const options = document.querySelectorAll("input[name='answer']");
    options.forEach(opt => {
      opt.addEventListener("change", e => {
        const val = parseInt(e.target.value);
        answers[currentQuestionIndex] = val;
        updateProgressBar();
      });
    });
    document.getElementById("btnPrev").onclick = () => {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        renderQuiz();
      }
    };
    document.getElementById("btnNext").onclick = () => {
      if (currentQuestionIndex < currentQuizQuestions.length - 1) {
        currentQuestionIndex++;
        renderQuiz();
      }
    };
    document.getElementById("btnSubmit").onclick = () => {
      if (answers.includes(null)) {
        if (!confirm("Bạn còn câu hỏi chưa trả lời. Bạn có chắc muốn nộp bài?")) return;
      }
      saveAttempt();
      renderResult();
    };
    // Progress bar buttons
    document.querySelectorAll(".progress-bar button").forEach(btn => {
      btn.onclick = () => {
        const idx = parseInt(btn.dataset.index);
        if (idx !== currentQuestionIndex) {
          currentQuestionIndex = idx;
          renderQuiz();
        }
      };
    });
  }

  function updateProgressBar() {
    document.querySelectorAll(".progress-bar button").forEach((btn, i) => {
      btn.classList.toggle("answered", answers[i] !== null);
    });
  }

  function renderResult() {
    currentMode = "result";
    const container = document.getElementById("app");
    const score = calculateScore();
    const total = currentQuizQuestions.length;
    const correctCount = answers.reduce((acc, ans, i) => acc + (ans === currentQuizQuestions[i].answerIndex ? 1 : 0), 0);
    const wrongCount = answers.filter((a,i) => a !== null && a !== currentQuizQuestions[i].answerIndex).length;
    const emptyCount = answers.filter(a => a === null).length;
    container.innerHTML = `
      <header>
        <h1>Tin học 10 - Bài 1: Thông tin và xử lí thông tin</h1>
        <p>Học sinh: <strong>${currentUser.name}</strong> | Lớp: <strong>${currentUser.class}</strong></p>
      </header>
      ${renderMenu()}
      <main role="main" aria-label="Kết quả làm bài">
        <section class="result" tabindex="0" aria-live="polite" aria-atomic="true">
          <div class="result-score" aria-label="Điểm số">${score} / 10</div>
          <div class="result-summary">
            Đúng: ${correctCount} &nbsp;&nbsp; Sai: ${wrongCount} &nbsp;&nbsp; Chưa trả lời: ${emptyCount}
          </div>
          <div style="text-align:center;">
            <button class="btn btn-primary" id="btnReview" aria-label="Xem lại bài làm">Xem lại</button>
            <button class="btn btn-secondary" id="btnRetry" aria-label="Làm lại bài">Làm lại</button>
          </div>
          <div id="reviewContainer" class="review-container" hidden aria-live="polite" aria-atomic="true"></div>
        </section>
      </main>
    `;
    document.getElementById("btnReview").onclick = () => {
      renderReview();
    };
    document.getElementById("btnRetry").onclick = () => {
      startQuiz(currentQuizQuestions.length === matrixDemo.questions.length ? "demo" : "practice");
    };
  }

  function renderReview() {
    currentMode = "review";
    const container = document.getElementById("reviewContainer");
    container.hidden = false;
    container.innerHTML = currentQuizQuestions.map((q,i) => {
      const userAns = answers[i];
      const correctAns = q.answerIndex;
      const isCorrect = userAns === correctAns;
      return `
        <div class="review-question" tabindex="0" aria-label="Câu ${i+1} ${isCorrect ? 'đúng' : 'sai'}">
          <p><strong>Câu ${i+1}:</strong> ${escapeHTML(q.question)}</p>
          <p>Đáp án của bạn: <span class="${isCorrect ? 'review-correct' : 'review-wrong'}">${userAns !== null ? escapeHTML(q.options[userAns]) : '<em>Chưa trả lời</em>'}</span></p>
          <p>Đáp án đúng: <span class="review-correct">${escapeHTML(q.options[correctAns])}</span></p>
          <p class="review-explanation">Giải thích: ${escapeHTML(q.explanation)}</p>
        </div>
      `;
    }).join("");
    container.focus();
  }

  // Lịch sử làm bài
  function renderHistory() {
    currentMode = "history";
    const container = document.getElementById("app");
    const hist = loadHistory();
    container.innerHTML = `
      <header>
        <h1>Lịch sử làm bài - Tin học 10 - Bài 1</h1>
        <p>Học sinh: <strong>${currentUser.name}</strong> | Lớp: <strong>${currentUser.class}</strong></p>
      </header>
      ${renderMenu()}
      <main role="main" aria-label="Lịch sử làm bài">
        <section class="lesson">
          <h2>Lịch sử các lần làm bài</h2>
          ${hist.length === 0 ? `<p>Chưa có dữ liệu lịch sử làm bài.</p>` : `
            <ul>
              ${hist.map((att, i) => `
                <li>
                  <button class="btn btn-secondary" data-index="${i}" aria-label="Xem chi tiết lần làm bài ngày ${att.datetime}">
                    Lần làm bài ngày ${new Date(att.datetime).toLocaleString()}
                  </button>
                </li>
              `).join("")}
            </ul>
            <div id="historyDetail" class="review-container" aria-live="polite" aria-atomic="true" style="margin-top:1rem;"></div>
            <div style="text-align:center; margin-top:1rem;">
              <button class="btn btn-primary" id="btnClearHistory" aria-label="Xóa lịch sử làm bài">Xóa lịch sử</button>
            </div>
          `}
        </section>
      </main>
    `;
    if (hist.length > 0) {
      const buttons = container.querySelectorAll("ul button");
      const detail = document.getElementById("historyDetail");
      buttons.forEach(btn => {
        btn.onclick = () => {
          const idx = parseInt(btn.dataset.index);
          const att = hist[idx];
          detail.innerHTML = att.questions.map((q,i) => {
            const userAns = att.answers[i];
            const correctAns = q.answerIndex;
            const isCorrect = userAns === correctAns;
            return `
              <div class="review-question" tabindex="0" aria-label="Câu ${i+1} ${isCorrect ? 'đúng' : 'sai'}">
                <p><strong>Câu ${i+1}:</strong> ${escapeHTML(q.question)}</p>
                <p>Đáp án của bạn: <span class="${isCorrect ? 'review-correct' : 'review-wrong'}">${userAns !== null ? escapeHTML(q.options[userAns]) : '<em>Chưa trả lời</em>'}</span></p>
                <p>Đáp án đúng: <span class="review-correct">${escapeHTML(q.options[correctAns])}</span></p>
                <p class="review-explanation">Giải thích: ${escapeHTML(q.explanation)}</p>
              </div>
            `;
          }).join("");
          detail.focus();
        };
      });
      document.getElementById("btnClearHistory").onclick = () => {
        if(confirm("Bạn có chắc chắn muốn xóa toàn bộ lịch sử làm bài của học sinh này?")) {
          history = [];
          saveHistory();
          renderHistory();
        }
      };
    }
  }

  // Trò chơi vận dụng: phân loại 6 tình huống tiếp nhận/xử lí/đưa kết quả/lưu trữ
  function renderGame() {
    currentMode = "game";
    const container = document.getElementById("app");
    container.innerHTML = `
      <header>
        <h1>Trò chơi vận dụng - Phân loại tình huống xử lí thông tin</h1>
        <p>Học sinh: <strong>${currentUser.name}</strong> | Lớp: <strong>${currentUser.class}</strong></p>
      </header>
      ${renderMenu()}
      <main role="main" aria-label="Trò chơi phân loại tình huống">
        <section class="lesson">
          <h2>Phân loại các tình huống xử lí thông tin</h2>
          <p>Chọn đúng loại quá trình: <strong>Tiếp nhận dữ liệu</strong>, <strong>Xử lí</strong>, <strong>Đưa kết quả</strong>, <strong>Lưu trữ</strong></p>
          <div class="card content-block" id="gameContainer" aria-live="polite" aria-atomic="true">
            <p id="gameSituation" style="font-weight:600; font-size:32px;"></p>
            <div style="margin-top:1rem;">
              <select id="gameSelect" aria-label="Chọn loại quá trình">
                <option value="" disabled selected>Chọn loại quá trình</option>
                <option value="Tiếp nhận dữ liệu">Tiếp nhận dữ liệu</option>
                <option value="Xử lí">Xử lí</option>
                <option value="Đưa kết quả">Đưa kết quả</option>
                <option value="Lưu trữ">Lưu trữ</option>
              </select>
            </div>
            <div style="margin-top:1rem;">
              <button class="btn btn-primary" id="btnCheckGame" aria-label="Kiểm tra lựa chọn">Kiểm tra</button>
              <button class="btn btn-secondary" id="btnResetGame" aria-label="Làm lại trò chơi">Làm lại</button>
            </div>
            <p id="gameFeedback" style="margin-top:1rem; font-weight:600;"></p>
          </div>
        </section>
      </main>
    `;
    const situations = [
      {text: "Nhập nhiệt độ đo được từ cảm biến vào máy tính.", answer: "Tiếp nhận dữ liệu"},
      {text: "Máy tính tính toán trung bình nhiệt độ từ các dữ liệu đã nhập.", answer: "Xử lí"},
      {text: "Hiển thị kết quả nhiệt độ trung bình trên màn hình.", answer: "Đưa kết quả"},
      {text: "Lưu trữ dữ liệu nhiệt độ vào bộ nhớ để sử dụng sau.", answer: "Lưu trữ"},
      {text: "Nhập ảnh chụp vào máy tính để xử lí.", answer: "Tiếp nhận dữ liệu"},
      {text: "Máy tính nén ảnh để giảm dung lượng lưu trữ.", answer: "Xử lí"}
    ];
    let currentSituationIndex = 0;
    const gameSituation = document.getElementById("gameSituation");
    const gameSelect = document.getElementById("gameSelect");
    const btnCheckGame = document.getElementById("btnCheckGame");
    const btnResetGame = document.getElementById("btnResetGame");
    const gameFeedback = document.getElementById("gameFeedback");

    function loadSituation() {
      gameSituation.textContent = situations[currentSituationIndex].text;
      gameSelect.value = "";
      gameFeedback.textContent = "";
      gameSelect.focus();
    }
    btnCheckGame.onclick = () => {
      if (!gameSelect.value) {
        alert("Vui lòng chọn loại quá trình trước khi kiểm tra.");
        gameSelect.focus();
        return;
      }
      if (gameSelect.value === situations[currentSituationIndex].answer) {
        gameFeedback.style.color = "#40e0d0";
        gameFeedback.textContent = "Chính xác! 🎉";
        currentSituationIndex++;
        if (currentSituationIndex >= situations.length) {
          setTimeout(() => {
            alert("Bạn đã hoàn thành trò chơi!");
            currentSituationIndex = 0;
            loadSituation();
          }, 1000);
        } else {
          setTimeout(loadSituation, 1500);
        }
      } else {
        gameFeedback.style.color = "#ff6f61";
        gameFeedback.textContent = "Sai rồi, hãy thử lại.";
      }
    };
    btnResetGame.onclick = () => {
      currentSituationIndex = 0;
      loadSituation();
    };
    loadSituation();
  }

  // On load
  window.onload = () => {
    renderStart();
  };
</script>
</head>
<body>
<div id="app" role="application" aria-live="polite" aria-atomic="true"></div>
</body>
