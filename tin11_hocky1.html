 ["Lưu tạm dữ liệu và chương trình đang chạy", "Lưu dữ liệu vĩnh viễn khi mất điện", "In tài liệu", "Kết nối Wi-Fi"], "answer": 0, "exp": "RAM là bộ nhớ làm việc, thường mất nội dung khi tắt nguồn."}, {"topic": "Thiết bị và lưu trữ", "level": "Nhận biết", "q": "Thiết bị nào thường dùng để lưu trữ dữ liệu lâu dài?", "opts": ["CPU", "RAM", "SSD", "Quạt tản nhiệt"], "answer": 2, "exp": "SSD là thiết bị lưu trữ không mất dữ liệu khi ngắt điện thông thường."}, {"topic": "Thiết bị và lưu trữ", "level": "Thông hiểu", "q": "Điểm khác biệt phổ biến giữa RAM và SSD là gì?", "opts": ["RAM lưu tạm, SSD lưu lâu dài", "RAM luôn có dung lượng lớn hơn SSD", "SSD chỉ đọc", "RAM không cần điện"], "answer": 0, "exp": "RAM hỗ trợ truy cập nhanh khi chạy chương trình; SSD dùng để lưu dữ liệu lâu dài."}, {"topic": "Thiết bị và lưu trữ", "level": "Thông hiểu", "q": "Sao lưu dữ liệu giúp ích gì?", "opts": ["Bảo đảm máy không nhiễm virus", "Có bản dự phòng khi dữ liệu gốc gặp sự cố", "Làm tăng tốc Internet", "Thay thế mật khẩu"], "answer": 1, "exp": "Bản sao lưu có thể hỗ trợ khôi phục dữ liệu khi mất hoặc hỏng bản gốc."}, {"topic": "Thiết bị và lưu trữ", "level": "Vận dụng", "q": "Một thư mục quan trọng chỉ nằm trên một USB. Cách giảm rủi ro mất dữ liệu là gì?", "opts": ["Tạo thêm bản sao ở nơi lưu trữ khác", "Đổi màu biểu tượng", "Đổi tên USB", "Chỉ mở thư mục khi cần"], "answer": 0, "exp": "Nên lưu bản sao dự phòng độc lập với USB."}, {"topic": "Thiết bị và lưu trữ", "level": "Vận dụng", "q": "Cần chia sẻ tài liệu cho nhóm mà vẫn kiểm soát quyền chỉnh sửa. Em nên làm gì?", "opts": ["Gửi mật khẩu tài khoản cá nhân", "Dùng dịch vụ lưu trữ đám mây và thiết lập quyền truy cập", "Đăng công khai lên mạng xã hội", "Tắt bảo vệ tệp"], "answer": 1, "exp": "Phân quyền xem/chỉnh sửa giúp cộng tác an toàn hơn."}, {"topic": "Internet và tìm kiếm", "level": "Nhận biết", "q": "Công cụ tìm kiếm trên web giúp người dùng làm gì?", "opts": ["Tìm trang và thông tin theo từ khóa", "Thay thế hệ điều hành", "Sử function study(){ $('app').innerHTML=`<section class="panel"><h2>📚 Tóm tắt kiến thức</h2><p class="muted">Chọn chủ đề để xem kiến thức cốt lõi.</p>${NOTES.map((n,i)=>`<details class="card" style="margin:10px 0" ${i===0?'open':''}><summary style="cursor:pointer;font-weight:750">${i+1}. ${esc(n[0])}</summary><p>${esc(n[1])}</p><p class="pill">${esc(n[2])}</p><button class="btn secondary" type="button" data-topic="${i}">Luyện tập chủ đề này</button></details>`).join('')}</section>`;

function requireProfile(){if(student.name.trim()&&student.className.trim())return true;alert('Vui lòng nhập Họ tên và Lớp tại Trang chủ trước khi làm bài.');page='home';render();return false}
function startQuiz(mode,topic=null){if(!requireProfile())return;const pool=topic?BANK.filter(q=>q.topic===topic):BANK;const chosen=mode==='exam'?shuffle(TOPICS).flatMap(t=>shuffle(BANK.filter(q=>q.topic===t)).slice(0,t===TOPICS[0]||t===TOPICS[1]||t===TOPICS[2]?3:2)).slice(0,15):shuffle(pool);session={mode,topic,questions:chosen,answers:Array(chosen.length).fill(null),index:0};page=mode==='exam'?'exam':'practice';render()}
function practice(){if(session)return quiz();$('app').innerHTML=`<section class="panel"><h2>✍️ Luyện tập</h2><p>Chọn ôn tập toàn bộ 36 câu hoặc một chủ đề (6 câu).</p><div class="actions"><button class="btn" id="all">Luyện tập toàn bộ</button></div><div class="grid">${TOPICS.map((t,i)=>`<div class="card"><h3>${esc(t)}</h3><p>6 câu hỏi</p><button class="btn secondary" data-topic="${i}">Bắt đầu</button></div>`).join('')}</div></section>`;$('all').onclick=()=>startQuiz('practice');$('app').querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>startQuiz('practice',TOPICS[Number(b.dataset.topic)]))}
function exam(){if(session)return quiz();$('app').innerHTML=`<section class="panel"><h2>📝 Đề kiểm tra học kỳ I (tham khảo)</h2><p>15 câu hỏi ngẫu nhiên từ 6 chủ đề. Thang điểm 10. Mỗi lần làm có thể thay đổi thứ tự câu.</p><p class="notice">Đây là đề ôn tập tham khảo, không thay thế ma trận kiểm tra chính thức của nhà trường.</p><button class="btn" id="begin">Bắt đầu làm đề</button></section>`;$('begin').onclick=()=>startQuiz('exam')}
function quiz(){const s=session,q=s.questions[s.index],selected=s.answers[s.index],done=s.answers.filter(x=>x!==null).length;$('app').innerHTML=`<section class="panel"><div class="tag">${s.mode==='exam'?'Đề kiểm tra':'Luyện tập'} • ${esc(q.level)}</div><h2>Câu ${s.index+1}/${s.questions.length}</h2><p class="muted">${esc(q.topic)} • Đã trả lời ${done}/${s.questions.length}</p><h3>${esc(q.q)}</h3><fieldset style="border:0;padding:0"><legend class="muted">Chọn một đáp án</legend>${q.opts.map((v,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${selected===i?'checked':''}><span><strong>${'ABCD'[i]}.</strong> ${esc(v)}</span></label>`).join('')}</fieldset><div class="actions"><button class="btn secondary" id="prev" ${s.index===0?'disabled':''}>← Câu trước</button><button class="btn secondary" id="next" ${s.index===s.questions.length-1?'disabled':''}>Câu tiếp →</button><button class="btn" id="submit">Nộp bài</button></div><div class="progress" aria-label="Chọn câu hỏi">${s.questions.map((_,i)=>`<button type="button" data-jump="${i}" class="${i===s.index?'current':s.answers[i]!==null?'done':''}" aria-label="Câu ${i+1}">${i+1}</button>`).join('')}</div></section>`;
$('app').querySelectorAll('input[name="answer"]').forEach(r=>r.onchange=()=>{s.answers[s.index]=Number(r.value);render()});$('prev').onclick=()=>{s.index--;render()};$('next').onclick=()=>{s.index++;render()};$('submit').onclick=submitQuiz;$('app').querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{s.index=Number(b.dataset.jump);render()})}
function submitQuiz(){const s=session,missing=s.answers.filter(x=>x===null).length;if(missing&&!confirm(`Còn ${missing} câu chưa trả lời. Vẫn nộp bài?`))return;const correct=s.questions.reduce((a,q,i)=>a+(s.answers[i]===q.answer?1:0),0);lastResult={id:Date.now(),date:new Date().toISOString(),name:student.name,className:student.className,mode:s.mode,topic:s.topic,questions:s.questions,answers:s.answers,correct,total:s.questions.length,score:Math.round(correct/s.questions.length*1000)/100};const old=storage();old.unshift(lastResult);saveStorage(old.slice(0,100));session=null;page='result';render()}
function result(){const r=lastResult;if(!r){navigate('home');return}$('app').innerHTML=`<section class="panel"><h2>🎉 Kết quả làm bài</h2><p>${esc(r.name)} • Lớp ${esc(r.className)}</p><div class="score">${r.score.toFixed(2)} / 10</div><p>Trả lời đúng <strong>${r.correct}/${r.total}</strong> câu</p><div class="actions"><button class="btn" id="review">Xem đáp án và giải thích</button><button class="btn secondary" id="retry">Làm bài khác</button><button class="btn secondary" id="export">Tải kết quả (.txt)</button></div><div id="details"></div></section>`;$('review').onclick=()=>showReview(r,$('details'));$('retry').onclick=()=>{page=r.mode==='exam'?'exam':'practice';render()};$('export').onclick=()=>downloadResult(r)}
function showReview(r,target){target.innerHTML=r.questions.map((q,i)=>{const ans=r.answers[i],ok=ans===q.answer;return `<div class="review ${ok?'good':'bad'}"><strong>Câu ${i+1}: ${esc(q.q)}</strong><p>Đã chọn: ${ans===null?'Chưa trả lời':esc('ABCD'[ans]+'. '+q.opts[ans])}</p><p><strong>Đáp án đúng: ${esc('ABCD'[q.answer]+'. '+q.opts[q.answer])}</strong></p><p>${esc(q.exp)}</p></div>`}).join('')}
function downloadResult(r){const lines=[`KẾT QUẢ ÔN TẬP TIN HỌC 11 – HKI`,`Họ tên: ${r.name}`,`Lớp: ${r.className}`,`Ngày: ${new Date(r.date).toLocaleString('vi-VN')}`,`Điểm: ${r.score.toFixed(2)}/10`,`Số câu đúng: ${r.correct}/${r.total}`,...r.questions.map((q,i)=>`${i+1}. ${q.q}\nĐã chọn: ${r.answers[i]===null?'Bỏ trống':q.opts[r.answers[i]]}\nĐáp án đúng: ${q.opts[q.answer]}`)];const blob=new Blob([lines.join('\n\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ket_qua_tin11_hk1.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function history(){const rows=storage().filter(r=>r&&r.name===student.name&&r.className===student.className);$('app').innerHTML=`<section class="panel"><h2>📊 Lịch sử làm bài</h2><p class="muted">Chỉ hiển thị các lượt làm trên trình duyệt này của ${esc(student.name||'học sinh hiện tại')}.</p>${rows.length?rows.map((r,i)=>`<div class="card" style="margin:10px 0"><strong>${new Date(r.date).toLocaleString('vi-VN')} • ${r.score.toFixed(2)}/10</strong><p>${r.mode==='exam'?'Đề kiểm tra':'Luyện tập'} • ${r.correct}/${r.total} câu đúng</p><button class="btn secondary" data-view="${i}">Xem chi tiết</button></div>`).join(''):'<p>Chưa có kết quả nào được lưu.</p>'}<div class="actions"><button class="btn warn" id="clear">Xóa lịch sử trên thiết bị</button></div><div id="histDetails"></div></section>`;$('app').querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>showReview(rows[Number(b.dataset.view)],$('histDetails')));$('clear').onclick=()=>{if(confirm('Xóa toàn bộ lịch sử đã lưu trên thiết bị này?')){saveStorage([]);render()}}}
const GAME=[['Nhận email yêu cầu nhập mật khẩu vào đường dẫn lạ.','Không bấm liên kết và xác minh nguồn',['Nhập ngay mật khẩu','Không bấm liên kết và xác minh nguồn','Chuyển tiếp cho bạn bè']],['Một bạn chia sẻ ảnh của em mà chưa xin phép.','Đề nghị bạn gỡ và trao đổi lịch sự',['Đăng ảnh bạn để trả đũa','Đề nghị bạn gỡ và trao đổi lịch sự','Công khai mật khẩu của bạn']],['Cần gửi email cho nhiều người mà không lộ địa chỉ của nhau.','Dùng Bcc',['Dùng Cc','Dùng Bcc','Đăng công khai danh sách']],['Máy tính chậm vì mở nhiều chương trình.','Đóng ứng dụng không cần thiết',['Xóa tệp hệ thống','Đóng ứng dụng không cần thiết','Rút ổ cứng']],['Cần dự phòng bài thuyết trình quan trọng.','Tạo bản sao ở vị trí khác',['Chỉ giữ trên một USB','Tạo bản sao ở vị trí khác','Đổi tên tệp']],['Muốn kiểm tra lịch thi mới nhất.','Xem thông báo chính thức của trường',['Tin bài đăng không nguồn','Xem thông báo chính thức của trường','Chỉ xem lượt thích']]];
function game(){const g=GAME[gameIndex];$('app').innerHTML=`<section class="panel"><h2>🎮 Trò chơi tình huống</h2>${gameIndex>=GAME.length?`<h3>Hoàn thành! Đúng ${gameScore}/${GAME.length} tình huống.</h3><button class="btn" id="again">Chơi lại</button>`:`<p class="tag">Tình huống ${gameIndex+1}/${GAME.length} • Đúng ${gameScore}</p><h3>${esc(g[0])}</h3>${g[2].map((a,i)=>`<button type="button" class="option" style="width:100%;text-align:left;background:white" data-choice="${i}">${esc(a)}</button>`).join('')}<p id="feedback" aria-live="polite"></p>`}</section>`;if(gameIndex>=GAME.length){$('again').onclick=()=>{gameIndex=0;gameScore=0;render()};return}$('app').querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const chosen=g[2][Number(b.dataset.choice)],ok=chosen===g[1];if(ok)gameScore++;$('app').querySelectorAll('[data-choice]').forEach(x=>x.disabled=true);$('feedback').innerHTML=`<p class="${ok?'pill':''}">${ok?'✅ Chính xác!':'❌ Chưa đúng.'} Đáp án: ${esc(g[1])}</p><button class="btn" id="advance">${gameIndex===GAME.length-1?'Xem kết quả':'Tình huống tiếp →'}</button>`;$('advance').onclick=()=>{gameIndex++;render()}})}
function render(){renderNav();if(page==='home')home();else if(page==='study')study();else if(page==='practice')practice();else if(page==='exam')exam();else if(page==='result')result();else if(page==='history')history();else if(page==='game')game()}
loadProfile();render();
</script></body></html>
