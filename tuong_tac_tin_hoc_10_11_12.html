<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vườn trò chơi Tin học THPT | Khối 10–11–12</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#17233b;background:#f3f6fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#193c86,#6550b7);color:white;padding:25px 16px;text-align:center}header h1{margin:0 0 8px;font-size:clamp(23px,4vw,36px)}header p{margin:0;opacity:.92}main{max-width:1000px;margin:20px auto;padding:0 15px 50px}.panel{background:white;border:1px solid #e0e7f3;border-radius:18px;padding:20px;box-shadow:0 8px 28px #1c32620d;margin-bottom:16px}.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.space{justify-content:space-between}.btn{cursor:pointer;border:1px solid #cbd6e9;background:white;color:#1c3768;border-radius:11px;padding:11px 15px;font-size:16px;font-weight:650;transition:.15s}.btn:hover,.btn:focus-visible{outline:2px solid #7f9be4;outline-offset:1px}.btn.active,.btn.primary{background:#294da4;color:white;border-color:#294da4}.btn:disabled{opacity:.45;cursor:not-allowed}.grade{flex:1;min-width:120px}.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.game-card{display:flex;flex-direction:column;align-items:flex-start;gap:9px;text-align:left;min-height:165px}.game-card strong{font-size:18px}.game-card small{font-size:14px;line-height:1.5}.emoji{font-size:29px}.muted{color:#58677f}.pill{border-radius:100px;background:#e9efff;color:#244483;padding:5px 11px;font-weight:700;font-size:13px}.progress{height:10px;border-radius:100px;background:#e9edf6;overflow:hidden;margin:15px 0}.bar{height:100%;background:#5374cf;transition:width .2s}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.choice{text-align:left;min-height:58px}.choice.correct{background:#e5f8ed;border-color:#36a96b;color:#14643c}.choice.wrong{background:#ffe9e9;border-color:#e27272;color:#8d2222}.feedback{padding:12px;border-radius:10px;background:#f0f5ff;margin-top:12px;line-height:1.6}.hidden{display:none!important}.match-grid{display:grid;grid-template-columns: </style></head><body><header><h1>🎮 VƯỜN TRÒ CHƠI TIN HỌC</h1><p>Học vui • Hiểu sâu • Chinh phục kiến thức THPT</p></header><main><section class="panel"><div class="flex space"><h2>1. Chọn khối lớp</h2><span class="pill" id="gradeLabel">TIN HỌC 10</span></div><div class="flex" id="gradeButtons"><button class="btn grade active" data-grade="10">Lớp 10</button><button class="btn grade" data-grade="11">Lớp 11</button><button class="btn grade" data-grade="12">Lớp 12</button></div></section><section class="panel" id="menu"><h2>2. Chọn trò chơi</h2><div class="games"><button class="btn game-card" data-game="quiz"><span class="emoji">🏆</span><strong>Ai là triệu phú Tin học</strong><small>10 câu hỏi trắc nghiệm, chấm điểm ngay và giải thích đáp án.</small></button><button class="btn game-card" data-game="match"><span class="emoji">🧩</span><strong>Ghép đôi kiến thức</strong><small>Ghép 5 thuật ngữ với mô tả tương ứng.</small></button><button class="btn game-card" data-game="tf"><span class="emoji">⚡</span><strong>Thử thách Đúng – Sai</strong><small>Phán đoán nhanh 8 nhận định Tin học.</small></button></div><div class="stats"><span class="pill" id="best">Thành tích: Chưa có</span><span class="muted">Kết quả được lưu trên trình duyệt đang dùng.</span></div></section><section class="panel hidden" id="play" aria-live="polite"><div class="flex space"><button class="btn" id="back">← Chọn trò chơi</button><span class="pill" id="modeLabel"></span></div><div id="gameBody" style="margin-top:16px"></div></section><footer>Học liệu tương tác Tin học THPT • Bản tham khảo do AI biên soạn • Có thể sử dụng trên GitHub Pages và Google Sites</footer></main><script>

['Khi nhận liên kết lạ yêu cầu nhập mật khẩu, em nên làm gì?',['Nhập ngay','Chia sẻ cho bạn','Kiểm tra nguồn và không cung cấp mật khẩu','Tắt máy'],2,'Không cung cấp mật khẩu qua liên kết đáng ngờ.'],

['Biểu thức Python 3 + 2 * 4 có giá trị bằng bao nhiêu?',['20','11','14','9'],1,'Phép nhân thực hiện trước phép cộng.'],
['Tên biến Python nào hợp lệ?',['2diem','diem_tb','diem-tb','class'],1,'Tên biến có thể chứa dấu gạch dưới và không bắt đầu bằng chữ số.'],
['Thông tin khác dữ liệu ở điểm nào?',['Thông tin là ý nghĩa rút ra từ dữ liệu','Thông tin luôn là số','Dữ liệu không lưu được','Hai khái niệm luôn giống hệt'],0,'Dữ liệu được xử lí và diễn giải để tạo ra thông tin có ý nghĩa.']
],match:[['Bit','Đơn vị thông tin nhỏ nhất'],['Byte','Nhóm 8 bit'],['CPU','Bộ xử lí trung tâm'],['RAM','Bộ nhớ truy cập ngẫu nhiên'],['Hệ điều hành','Phần mềm quản lí hoạt động máy tính']],tf:[['1 byte bằng 8 bit.',true],['Bàn phím là thiết bị xuất.',false],['Mật khẩu mạnh nên dùng chung cho mọi tài khoản.',false],['Python phân biệt chữ hoa và chữ thường.',true],['print() dùng để hiển thị kết quả.',true],['Internet chỉ kết nối các máy trong một phòng.',false],['Thông tin có thể được biểu diễn bằng hình ảnh và âm thanh.',true],['Nên kiểm tra địa chỉ trang web trước khi đăng nhập.',true]]},

['Truy vấn dữ liệu được dùng để làm gì?',['Tìm và lấy thông tin theo yêu cầu','Xóa hệ điều hành','Thay màn hình','Đổi bàn phím'],0,'Truy vấn giúp khai thác dữ liệu theo điều kiện.'],
['Hệ quản trị cơ sở dữ liệu có chức năng nào?',['Quản lí và khai thác cơ sở dữ liệu','Chỉ soạn văn bản','Chỉ phát nhạc','Chỉ vẽ hình'],0,'DBMS hỗ trợ tạo lập, cập nhật và truy xuất dữ liệu.'],
['Trong SQL, câu lệnh nào thường dùng để lấy dữ liệu?',['SELECT','DELETE','INSERT','DROP'],0,'SELECT dùng để truy vấn dữ liệu.'],
['Điều kiện lọc bản ghi trong SQL thường đặt sau từ khóa nào?',['WHERE','ORDER BY','FROM','TABLE'],0,'WHERE xác định điều kiện lọc.'],
['Câu lệnh SQL nào thêm một hàng dữ liệu?',['INSERT INTO','SELECT','UPDATE','ORDER BY'],0,'INSERT INTO dùng để thêm bản ghi.'],
['Vì sao cần sao lưu dữ liệu?',['Để có bản phục hồi khi xảy ra sự cố','Để dữ liệu tự biến mất','Để tắt mạng','Để giảm độ chính xác'],0,'Sao lưu giúp giảm nguy cơ mất dữ liệu.']
],match:[['Bản ghi','Một hàng dữ liệu trong bảng'],['Trường dữ liệu','Một cột mô tả thuộc tính'],['SELECT','Truy vấn lấy dữ liệu'],['WHERE','Đặt điều kiện lọc'],['INSERT INTO','Thêm bản ghi mới']],tf:[['Thêm một học sinh mới là cập nhật dữ liệu.',true],['Mỗi bản ghi trong bảng luôn phải có cùng họ tên.',false],['SELECT thường dùng để lấy dữ liệu.',true],['WHERE thường dùng để lọc theo điều kiện.',true],['Sao lưu dữ liệu là không cần thiết.',false],['Mã học sinh có thể được thiết kế làm khóa chính.',true],['DELETE dùng để thêm bản ghi mới.',false],['Dữ liệu có tổ chức giúp việc tìm kiếm thuận tiện hơn.',true]]},
12:{quiz:[
['AI là viết tắt của cụm từ nào?',['Artificial Intelligence','Automatic Internet','Advanced Input','Artificial Interface'],0,'AI là trí tuệ nhân tạo.'],
['Ví dụ nào là ứng dụng AI?',['Hệ thống nhận diện giọng nói','Dây cáp mạng','Bàn phím cơ','Ổ cắm điện'],0,'Nhận diện giọng nói có thể sử dụng mô hình AI.'],
['Khi dùng AI tạo nội dung học tập, điều quan trọng là gì?',['Tin tuyệt đối','Kiểm chứng thông tin','Bỏ qua nguồn','Đăng mọi dữ liệu cá nhân'],1,'Kết quả AI có thể sai nên cần kiểm chứng.'],
['Thiết bị nào thường dùng để kết nối các mạng khác nhau?',['Router','Bàn phím','Máy quét','Webcam'],0,'Router định tuyến gói tin giữa các mạng.'],
['Giao thức thường dùng để truy cập trang web an toàn là gì?',['HTTPS','FTP','SMTP','POP3'],0,'HTTPS dùng kết nối web được mã hóa.'],
['Trong HTML, thẻ nào tạo liên kết?',['<a>','<p>','<h1>','<ul>'],0,'Thẻ a với thuộc tính href tạo liên kết.'],
['Thẻ HTML nào dùng để tạo đoạn văn?',['<p>','<img>','<table>','<br>'],0,'Thẻ p biểu diễn đoạn văn.'],
['Thuộc tính nào của thẻ img chỉ định đường dẫn ảnh?',['src','href','alt','title'],0,'src chứa đường dẫn nguồn ảnh.'],
['Trong HTML, danh sách không thứ tự dùng thẻ nào?',['<ul>','<ol>','<table>','<div>'],0,'ul tạo danh sách không thứ tự.'],
['Khi nhận tin nhắn có đường dẫn đăng nhập lạ, cách làm phù hợp là gì?',['Kiểm tra nguồn và không nhập mật khẩu','Gửi mật khẩu ngay','Chuyển tiếp cho mọi người','Tải mọi tệp đính kèm'],0,'Cần xác minh nguồn trước khi truy cập hoặc cung cấp thông tin.']
],match:[['AI','Trí tuệ nhân tạo'],['Router','Thiết bị định tuyến'],['HTTPS','Giao thức web bảo mật'],['<a>','Thẻ tạo liên kết'],['<img>','Thẻ chèn hình ảnh']],tf:[['AI có thể tạo ra thông tin không chính xác.',true],['HTTPS giúp mã hóa dữ liệu truyền giữa trình duyệt và website.',true],['Thẻ <p> dùng để tạo bảng.',false],['Thuộc tính href thường dùng trong thẻ <a>.',true],['Có thể công khai mật khẩu trên mạng xã hội.',false],['Router là thiết bị dùng để định tuyến.',true],['<ul> tạo danh sách có thứ tự.',false],['Cần tôn trọng quyền riêng tư khi giao tiếp trên mạng.',true]]}
};
let grade='10',mode='',idx=0,score=0,locked=false,order=[],selected=null,paired=new Set(),wrongAttempts=0;
const $=id=>document.getElementById(id),escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function bestKey(){return 'trochoitinhoc_best_'+grade}function best(){try{return JSON.parse(localStorage.getItem(bestKey())||'{}')}catch{return {}}}
function updateBest(){let b=best();$('best').textContent='Kỷ lục: '+(Object.keys(b).length?Object.entries(b).map(([k,v])=>({quiz:'Trắc nghiệm',match:'Ghép đôi',tf:'Đúng–Sai'}[k]+': '+v)).join(' • '):'Chưa có')}
function saveBest(m,s){try{let b=best();b[m]=Math.max(b[m]||0,s);localStorage.setItem(bestKey(),JSON.stringify(b))}catch{}updateBest()}
function chooseGrade(g){grade=g;document.querySelectorAll('[data-grade]').forEach(b=>b.classList.toggle('active',b.dataset.grade===g));$('gradeLabel').textContent='TIN HỌC '+g;exitGame();updateBest()}
function exitGame(){mode='';$('play').classList.add('hidden');$('menu').classList.remove('hidden')}
function startGame(m){mode=m;idx=0;score=0;locked=false;selected=null;paired=new Set();wrongAttempts=0;order=shuffle([...Array(BANK[grade][m==='quiz'?'quiz':m==='tf'?'tf':'match'].length).keys()]);$('menu').classList.add('hidden');$('play').classList.remove('hidden');$('modeLabel').textContent={quiz:'🏆 Ai là triệu phú',match:'🧩 Ghép đôi',tf:'⚡ Đúng – Sai'}[m];render()}
function heading(n,total,title){return `<div class="flex space"><span class="pill">Câu ${n}/${total}</span><span class="pill">Điểm: ${score}</span></div><div class="progress"><div class="bar" style="width:${(n-1)/total*100}%"></div></div><h3>${escapeHTML(title)}</h3>`}
function render(){if(mode==='quiz')renderQuiz();else if(mode==='tf')renderTF();else renderMatch()}
function renderQuiz(){const q=BANK[grade].quiz[order[idx]];let opts=q[1].map((t,i)=>`<button class="btn choice" data-answer="${i}">${String.fromCharCode(65+i)}. ${escapeHTML(t)}</button>`).join('');$('gameBody').innerHTML=heading(idx+1,order.length,q[0])+`<div class="choices">${opts}</div><div id="feedback" class="hidden feedback"></div><div style="margin-top:14px"><button id="next" class="btn primary hidden">${idx===order.length-1?'Xem kết quả':'Câu tiếp theo →'}</button></div>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answerQuiz(Number(b.dataset.answer)));$('next').onclick=next}
function answerQuiz(a){if(locked)return;locked=true;let q=BANK[grade].quiz[order[idx]],correct=a===q[2];if(correct)score++;document.querySelectorAll('[data-answer]').forEach(b=>{let i=Number(b.dataset.answer);b.disabled=true;if(i===q[2])b.classList.add('correct');else if(i===a)b.classList.add('wrong')});$('feedback').classList.remove('hidden');$('feedback').textContent=(correct?'✅ Chính xác! ':'❌ Chưa đúng. ')+q[4];$('next').classList.remove('hidden')}
function renderTF(){let q=BANK[grade].tf[order[idx]];$('gameBody').innerHTML=heading(idx+1,order.length,q[0])+`<div class="choices"><button class="btn choice" data-tf="true">✓ Đúng</button><button class="btn choice" data-tf="false">✕ Sai</button></div><div id="feedback" class="feedback hidden"></div><div style="margin-top:14px"><button class="btn primary hidden" id="next">${idx===order.length-1?'Xem kết quả':'Câu tiếp theo →'}</button></div>`;document.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>answerTF(b.dataset.tf==='true'));$('next').onclick=next}
function answerTF(a){if(locked)return;locked=true;let q=BANK[grade].tf[order[idx]],correct=a===q[1];if(correct)score++;document.querySelectorAll('[data-tf]').forEach(b=>{let v=b.dataset.tf==='true';b.disabled=true;if(v===q[1])b.classList.add('correct');else if(v===a)b.classList.add('wrong')});$('feedback').classList.remove('hidden');$('feedback').textContent=correct?'✅ Chính xác!':'❌ Chưa chính xác. Đáp án: '+(q[1]?'Đúng':'Sai')+'.';$('next').classList.remove('hidden')}
function next(){idx++;locked=false;if(idx>=order.length)finish();else render()}
function renderMatch(){let data=BANK[grade].match, right=shuffle([...Array(data.length).keys()]);$('gameBody').innerHTML=`<h3>Ghép thuật ngữ với mô tả phù hợp</h3><p class="muted">Chọn một ô bên trái, sau đó chọn mô tả tương ứng bên phải.</p><div class="flex space"><span class="pill" id="pairCount">Đã ghép: 0/${data.length}</span><span class="pill" id="mistakes">Lượt sai: 0</span></div><div class="match-grid" style="margin-top:16px"><div class="match-col">${data.map((x,i)=>`<button class="btn match" data-left="${i}">${escapeHTML(x[0])}</button>`).join('')}</div><div class="match-col">${right.map(i=>`<button class="btn match" data-right="${i}">${escapeHTML(data[i][1])}</button>`).join('')}</div></div><div class="feedback hidden" id="feedback" role="status"></div><div style="margin-top:14px"><button class="btn primary hidden" id="complete">Xem kết quả</button></div>`;document.querySelectorAll('[data-left]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.left);if(paired.has(i))return;selected=i;document.querySelectorAll('[data-left]').forEach(x=>x.classList.toggle('selected',x===b));$('feedback').classList.add('hidden')});document.querySelectorAll('[data-right]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.right);if(paired.has(i))return;if(selected===null){$('feedback').textContent='Hãy chọn thuật ngữ ở cột bên trái trước.';$('feedback').classList.remove('hidden');return}if(selected===i){paired.add(i);document.querySelector(`[data-left="${i}"]`).className='btn match done';document.querySelector(`[data-left="${i}"]`).disabled=true;b.className='btn match done';b.disabled=true;selected=null;$('pairCount').textContent='Đã ghép: '+paired.size+'/'+data.length;$('feedback').textContent='✅ Ghép chính xác!';if(paired.size===data.length)$('complete').classList.remove('hidden')}else{wrongAttempts++;$('mistakes').textContent='Lượt sai: '+wrongAttempts;$('feedback').textContent='❌ Chưa đúng, em hãy thử lại.'}$('feedback').classList.remove('hidden')});$('complete').onclick=()=>{score=Math.max(0,5-wrongAttempts);finish()}}
function finish(){let total=mode==='match'?5:order.length,points=mode==='match'?score:score;saveBest(mode,points);let percent=Math.round(points/total*100);$('gameBody').innerHTML=`<div style="text-align:center;padding:18px 0"><div style="font-size:58px">${percent>=80?'🏅':percent>=50?'🌟':'💪'}</div><h2>Hoàn thành thử thách!</h2><p style="font-size:25px;font-weight:800">${points}/${total} điểm</p><p>${percent>=80?'Rất tốt! Em đã nắm chắc nhiều kiến thức.':percent>=50?'Khá tốt! Hãy ôn lại những phần chưa chắc.':'Hãy luyện tập thêm để tiến bộ nhé!'}</p><div class="flex" style="justify-content:center"><button class="btn primary" id="again">↻ Chơi lại</button><button class="btn" id="return">← Chọn trò chơi khác</button></div></div>`;$('again').onclick=()=>startGame(mode);$('return').onclick=exitGame}
document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>chooseGrade(b.dataset.grade));document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>startGame(b.dataset.game));$('back').onclick=exitGame;updateBest();
</script></body></html>
