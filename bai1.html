<script>
'use strict';
const QUESTIONS=[{"id":"nb1","type":"Nhận biết","question":"Dữ liệu là gì trong tin học?","options":["Ý nghĩa và hiểu biết rút ra từ dữ liệu","Biểu diễn có thể lưu, xử lí, truyền của thông tin","Quá trình xử lí thông tin","Thiết bị lưu trữ thông tin"],"answerIndex":1,"explanation":"Dữ liệu là biểu diễn có thể lưu, xử lí, truyền của thông tin, còn thông tin là ý nghĩa, hiểu biết rút ra từ dữ liệu."},{"id":"nb2","type":"Nhận biết","question":"Thông tin khác dữ liệu ở điểm nào?","options":["Thông tin là biểu diễn, dữ liệu là ý nghĩa","Thông tin là ý nghĩa, dữ liệu là biểu diễn","Thông tin và dữ liệu giống nhau","Thông tin không thể lưu trữ"],"answerIndex":1,"explanation":"Thông tin là ý nghĩa, hiểu biết rút ra từ dữ liệu; dữ liệu là biểu diễn có thể lưu, xử lí, truyền."},{"id":"nb3","type":"Nhận biết","question":"Bit là gì?","options":["Đơn vị lưu trữ lớn nhất","Đơn vị lưu trữ nhỏ nhất, biểu diễn 0 hoặc 1","Đơn vị lưu trữ bằng 8 byte","Đơn vị lưu trữ bằng 1024 byte"],"answerIndex":1,"explanation":"Bit là đơn vị lưu trữ nhỏ nhất, biểu diễn giá trị 0 hoặc 1."},{"id":"nb4","type":"Nhận biết","question":"1 Byte bằng bao nhiêu bit theo quy ước nhị phân?","options":["8 bit","10 bit","1024 bit","1 bit"],"answerIndex":0,"explanation":"Theo quy ước nhị phân, 1 Byte = 8 bit."},{"id":"nb5","type":"Nhận biết","question":"1 KB (Kilobyte) bằng bao nhiêu Byte theo quy ước nhị phân?","options":["1000 Byte","1024 Byte","8 Byte","1 Byte"],"answerIndex":1,"explanation":"Theo quy ước nhị phân, 1 KB = 1024 Byte."},{"id":"nb6","type":"Nhận biết","question":"Thiết bị số có ưu điểm nào sau đây?","options":["Lưu trữ và xử lí thông tin chính xác tuyệt đối","Lưu trữ, xử lí và truyền thông tin nhanh, hiệu quả","Không bao giờ bị lỗi phần cứng","Không cần nguồn điện"],"answerIndex":1,"explanation":"Thiết bị số ưu việt ở khả năng lưu trữ, xử lí và truyền thông tin nhanh và hiệu quả, nhưng không phải luôn chính xác tuyệt đối."},{"id":"nb7","type":"Nhận biết","question":"Dữ liệu thiếu ngữ cảnh sẽ như thế nào?","options":["Vẫn có thể hiểu đúng ý nghĩa","Không xác định được ý nghĩa chính xác","Luôn chính xác và đầy đủ","Không cần xử lí"],"answerIndex":1,"explanation":"Dữ liệu thiếu ngữ cảnh không xác định được ý nghĩa chính xác."},{"id":"nb8","type":"Nhận biết","question":"Quá trình xử lí thông tin gồm các bước nào?","options":["Tiếp nhận dữ liệu, xử lí, đưa kết quả, lưu trữ","Chỉ lưu trữ dữ liệu","Chỉ truyền dữ liệu","Chỉ xử lí dữ liệu"],"answerIndex":0,"explanation":"Quá trình xử lí thông tin gồm tiếp nhận dữ liệu, xử lí, đưa kết quả và lưu trữ."},{"id":"nb9","type":"Nhận biết","question":"Thông tin có thể có bao nhiêu biểu diễn dữ liệu?","options":["Chỉ một biểu diễn duy nhất","Nhiều biểu diễn khác nhau","Không có biểu diễn","Chỉ biểu diễn số"],"answerIndex":1,"explanation":"Thông tin có thể có nhiều biểu diễn dữ liệu khác nhau."},{"id":"nb10","type":"Nhận biết","question":"Quy ước nhị phân trong lưu trữ dữ liệu là gì?","options":["Dùng hệ thập phân để tính toán dung lượng","Dùng hệ cơ số 2, 1 KB = 1024 B","Dùng hệ thập phân, 1 KB = 1000 B","Dùng hệ cơ số 16"],"answerIndex":1,"explanation":"Quy ước nhị phân dùng hệ cơ số 2, 1 KB = 1024 Byte."},{"id":"th1","type":"Thông hiểu","question":"Tại sao thông tin không thể xác định chính xác nếu chỉ có dữ liệu mà không có ngữ cảnh?","options":["Dữ liệu luôn đầy đủ ý nghĩa","Ngữ cảnh giúp hiểu đúng ý nghĩa dữ liệu","Dữ liệu không cần ngữ cảnh để hiểu","Ngữ cảnh làm dữ liệu bị sai lệch"],"answerIndex":1,"explanation":"Ngữ cảnh giúp hiểu đúng ý nghĩa dữ liệu, nếu thiếu thì thông tin không xác định chính xác."},{"id":"th2","type":"Thông hiểu","question":"Ưu điểm của lưu trữ dữ liệu bằng thiết bị số là gì?","options":["Lưu trữ lâu dài, dễ dàng xử lí và truyền tải","Lưu trữ không cần nguồn điện","Không bao giờ bị mất dữ liệu","Dữ liệu không thể bị thay đổi"],"answerIndex":0,"explanation":"Thiết bị số lưu trữ lâu dài, dễ dàng xử lí và truyền tải dữ liệu."},{"id":"th3","type":"Thông hiểu","question":"Bit và Byte khác nhau như thế nào?","options":["Bit là 8 Byte","Byte là 8 Bit","Bit và Byte bằng nhau","Byte là đơn vị nhỏ hơn Bit"],"answerIndex":1,"explanation":"1 Byte = 8 Bit."},{"id":"th4","type":"Thông hiểu","question":"Tại sao quy ước 1 KB = 1024 Byte được dùng trong tin học?","options":["Vì 1024 là số gần 1000 nhất","Vì hệ nhị phân dùng cơ số 2, 1024 = 2^10","Vì 1024 là số nguyên tố","Vì 1024 là số chẵn"],"answerIndex":1,"explanation":"Hệ nhị phân dùng cơ số 2, 1024 = 2^10 nên dùng làm đơn vị chuẩn."},{"id":"th5","type":"Thông hiểu","question":"Quá trình xử lí thông tin trong máy tính bắt đầu từ bước nào?","options":["Lưu trữ dữ liệu","Xử lí dữ liệu","Tiếp nhận dữ liệu","Đưa kết quả"],"answerIndex":2,"explanation":"Quá trình bắt đầu từ tiếp nhận dữ liệu."},{"id":"th6","type":"Thông hiểu","question":"Thông tin có thể được biểu diễn dưới dạng nào?","options":["Chỉ dạng số","Dạng số, chữ, hình ảnh, âm thanh","Chỉ dạng chữ","Chỉ dạng hình ảnh"],"answerIndex":1,"explanation":"Thông tin có thể biểu diễn dưới nhiều dạng: số, chữ, hình ảnh, âm thanh."},{"id":"th7","type":"Thông hiểu","question":"Tại sao thiết bị số không luôn đúng tuyệt đối?","options":["Do lỗi phần mềm, phần cứng và giới hạn kỹ thuật","Do dữ liệu luôn sai","Do người dùng nhập sai","Do thiết bị không có bộ nhớ"],"answerIndex":0,"explanation":"Thiết bị số có thể có lỗi phần mềm, phần cứng và giới hạn kỹ thuật nên không luôn đúng tuyệt đối."},{"id":"th8","type":"Thông hiểu","question":"Lưu trữ dữ liệu theo quy ước nhị phân có ưu điểm gì?","options":["Tương thích với cấu trúc máy tính","Dễ nhầm lẫn với hệ thập phân","Không thể chuyển đổi sang hệ khác","Không có ưu điểm"],"answerIndex":0,"explanation":"Quy ước nhị phân tương thích với cấu trúc máy tính dùng bit."},{"id":"th9","type":"Thông hiểu","question":"Phân biệt thông tin và dữ liệu giúp ích gì trong tin học?","options":["Giúp xử lí và lưu trữ chính xác hơn","Không có ích gì","Chỉ dùng cho phần cứng","Chỉ dùng cho phần mềm"],"answerIndex":0,"explanation":"Phân biệt giúp xử lí và lưu trữ dữ liệu chính xác, hiểu đúng ý nghĩa thông tin."},{"id":"th10","type":"Thông hiểu","question":"Đơn vị lưu trữ nào lớn hơn 1 GB theo quy ước nhị phân?","options":["1 MB","1 TB","1 KB","1 bit"],"answerIndex":1,"explanation":"1 TB (Terabyte) lớn hơn 1 GB (Gigabyte)."},{"id":"vd1","type":"Vận dụng","question":"Một file ảnh có dung lượng 5 MB. Hỏi dung lượng này bằng bao nhiêu Byte theo quy ước nhị phân?","options":["5 x 1000 x 1000 Byte","5 x 1024 x 1024 Byte","5 x 8 Byte","5 x 1024 Byte"],"answerIndex":1,"explanation":"1 MB = 1024 x 1024 Byte theo quy ước nhị phân, nên 5 MB = 5 x 1024 x 1024 Byte."},{"id":"vd2","type":"Vận dụng","question":"Nếu một đoạn dữ liệu có 2048 Byte, hỏi nó bằng bao nhiêu KB theo quy ước nhị phân?","options":["2 KB","2048 KB","0.5 KB","1 KB"],"answerIndex":0,"explanation":"2048 Byte = 2048 / 1024 = 2 KB."},{"id":"vd3","type":"Vận dụng","question":"Một thiết bị số lưu trữ 2 TB. Hỏi dung lượng này bằng bao nhiêu GB theo quy ước nhị phân?","options":["2048 GB","2000 GB","2 x 1000 GB","2 x 1024 GB"],"answerIndex":3,"explanation":"1 TB = 1024 GB theo quy ước nhị phân, nên 2 TB = 2 x 1024 GB = 2048 GB."},{"id":"vd4","type":"Vận dụng","question":"Một thông tin có thể biểu diễn dưới các dạng dữ liệu khác nhau. Ví dụ nào sau đây không phải là biểu diễn dữ liệu của cùng một thông tin?","options":["Chữ viết, âm thanh, hình ảnh","Số liệu, biểu đồ, văn bản","Hình ảnh, video, âm thanh","Số liệu, nhiệt độ, màu sắc"],"answerIndex":3,"explanation":"Nhiệt độ và màu sắc là các loại thông tin khác nhau, không phải biểu diễn dữ liệu của cùng một thông tin."},{"id":"vd5","type":"Vận dụng","question":"Một học sinh nhập dữ liệu nhiệt độ 25°C vào máy tính. Dữ liệu này thuộc loại nào?","options":["Dữ liệu số","Dữ liệu chữ","Dữ liệu âm thanh","Dữ liệu hình ảnh"],"answerIndex":0,"explanation":"Nhiệt độ 25°C là dữ liệu số."},{"id":"vd6","type":"Vận dụng","question":"Quá trình xử lí thông tin gồm các bước: Tiếp nhận dữ liệu, xử lí, đưa kết quả và lưu trữ. Hãy sắp xếp đúng thứ tự các bước này.","options":["Xử lí, tiếp nhận, lưu trữ, đưa kết quả","Tiếp nhận, xử lí, đưa kết quả, lưu trữ","Lưu trữ, tiếp nhận, xử lí, đưa kết quả","Đưa kết quả, xử lí, tiếp nhận, lưu trữ"],"answerIndex":1,"explanation":"Thứ tự đúng là: Tiếp nhận dữ liệu, xử lí, đưa kết quả, lưu trữ."},{"id":"vd7","type":"Vận dụng","question":"Một file văn bản có dung lượng 512 KB. Hỏi dung lượng này bằng bao nhiêu Byte theo quy ước nhị phân?","options":["512 x 1000 Byte","512 x 1024 Byte","512 x 8 Byte","512 Byte"],"answerIndex":1,"explanation":"1 KB = 1024 Byte, nên 512 KB = 512 x 1024 Byte."},{"id":"vd8","type":"Vận dụng","question":"Nếu một thiết bị lưu trữ có dung lượng 1 GB, hỏi nó bằng bao nhiêu MB theo quy ước nhị phân?","options":["1000 MB","1024 MB","8 MB","1 MB"],"answerIndex":1,"explanation":"1 GB = 1024 MB theo quy ước nhị phân."},{"id":"vd9","type":"Vận dụng","question":"Một đoạn dữ liệu có 8192 bit. Hỏi nó bằng bao nhiêu Byte theo quy ước nhị phân?","options":["1024 Byte","8192 Byte","512 Byte","8 Byte"],"answerIndex":0,"explanation":"1 Byte = 8 bit, nên 8192 bit = 8192 / 8 = 1024 Byte."},{"id":"vd10","type":"Vận dụng","question":"Tại sao máy tính không thể hiểu trực tiếp thông tin mà phải chuyển sang dữ liệu?","options":["Máy tính chỉ xử lí được dữ liệu biểu diễn dưới dạng số nhị phân","Máy tính hiểu được mọi dạng thông tin","Thông tin và dữ liệu giống nhau","Máy tính không cần dữ liệu"],"answerIndex":0,"explanation":"Máy tính chỉ xử lí được dữ liệu biểu diễn dưới dạng số nhị phân (bit)."}];
const DEMO_IDS=['nb1','nb2','nb7','th1','th9','nb3','nb4','nb5','th4','vd1','nb6','th7','th10','vd3','vd10'];
const KEY='goc-on-tap-tin10-v1';let state={tab:'home',questions:[],answers:[],index:0,mode:'practice',result:false,gameIndex:0,gameScore:0};

function render(){const v=$('view');if(state.tab==='home')v.innerHTML=home();if(state.tab==='study')v.innerHTML=study();if(state.tab==='quiz')v.innerHTML=quizView();if(state.tab==='game')v.innerHTML=gameView();if(state.tab==='history')v.innerHTML=historyView();}
function home(){return `<span class="tag">TIN HỌC 10 · BÀI 1</span><h2>Thông tin và xử lí thông tin</h2><p class="sub">Bắt đầu với bài học đầu tiên. Các bài tiếp theo có thể bổ sung vào ứng dụng khi cô cung cấp nội dung.</p><div class="grid"><article class="tile"><span class="tag">01 · HỌC</span><h3>Ôn kiến thức</h3><p>Khái niệm thông tin, dữ liệu, quá trình xử lí và đơn vị lưu trữ.</p><button class="btn" onclick="tab('study')">Xem bài học</button></article><article class="tile"><span class="tag">02 · LUYỆN</span><h3>30 câu trắc nghiệm</h3><p>Ba mức độ: nhận biết, thông hiểu và vận dụng; có chấm điểm, giải thích.</p><button class="btn" onclick="startQuiz('practice')">Luyện tập ngay</button></article><article class="tile"><span class="tag">03 · KIỂM TRA</span><h3>Đề minh họa 15 câu</h3><p>Kiểm tra nhanh và xem kết quả theo thang điểm 10.</p><button class="btn purple" onclick="startQuiz('demo')">Làm đề minh họa</button></article></div><div class="lesson"><strong>Gợi ý học tập:</strong> Đọc kiến thức → làm câu hỏi → xem lời giải → thử sức với trò chơi vận dụng.</div>`}
function study(){return `<h2>📖 Ôn tập kiến thức – Bài 1</h2><p class="sub">Tóm tắt dựa trên nội dung ứng dụng cô đã cung cấp.</p><div class="lesson"><h3>1. Thông tin và dữ liệu</h3><p><b>Thông tin</b> là ý nghĩa, hiểu biết rút ra từ dữ liệu, giúp con người hiểu và ra quyết định.</p><p><b>Dữ liệu</b> là cách biểu diễn thông tin để có thể lưu trữ, xử lí và truyền tải, ví dụ: số, chữ, hình ảnh, âm thanh.</p><p>Dữ liệu cần ngữ cảnh để xác định đúng ý nghĩa.</p></div><div class="lesson"><h3>2. Quá trình xử lí thông tin</h3><p><b>Tiếp nhận dữ liệu → Xử lí → Đưa kết quả → Lưu trữ</b></p></div><div class="lesson"><h3>3. Đơn vị lưu trữ</h3><p>1 Byte = 8 bit. Theo quy ước sử dụng trong tài liệu bài học: 1 KB = 1024 Byte; 1 MB = 1024 KB; 1 GB = 1024 MB; 1 TB = 1024 GB.</p><p class="mini">Ghi chú: Trong chuẩn đơn vị hiện đại, các bội số 1024 được ký hiệu chính xác là KiB, MiB, GiB, TiB.</p></div><div class="lesson"><h3>4. Thiết bị số</h3><p><b>Ưu điểm:</b> Lưu trữ, xử lí và truyền tải thông tin nhanh, hiệu quả.</p><p><b>Giới hạn:</b> Thiết bị vẫn có thể gặp lỗi phần mềm, phần cứng và giới hạn kỹ thuật.</p></div><div class="actions"><button class="btn" onclick="startQuiz('practice')">Làm bài luyện tập</button><button class="btn secondary" onclick="tab('home')">Về trang chủ</button></div>`}
function startQuiz(mode){state.mode=mode;state.questions=mode==='demo'?DEMO_IDS.map(id=>QUESTIONS.find(q=>q.id===id)):QUESTIONS.map(q=>({...q}));state.answers=Array(state.questions.length).fill(null);state.index=0;state.result=false;tab('quiz')}
function quizView(){if(!state.questions.length)return `<h2>✍️ Luyện tập trắc nghiệm</h2><p class="sub">Chọn hình thức luyện tập phù hợp.</p><div class="grid"><div class="tile"><h3>30 câu luyện tập</h3><p>Toàn bộ ngân hàng câu hỏi của Bài 1.</p><button class="btn" onclick="startQuiz('practice')">Bắt đầu</button></div><div class="tile"><h3>15 câu đề minh họa</h3><p>Đề được chọn sẵn theo cấu trúc của file gốc.</p><button class="btn purple" onclick="startQuiz('demo')">Bắt đầu</button></div></div>`;if(state.result)return resultView();const q=state.questions[state.index],done=state.answers.filter(a=>a!==null).length;return `<div class="question-top"><h2>${state.mode==='demo'?'Đề minh họa':'Luyện tập Bài 1'}</h2><span class="tag">${done}/${state.questions.length} đã trả lời</span></div><div class="meter"><div style="width:${100*done/state.questions.length}%"></div></div><div class="mini">Câu ${state.index+1}/${state.questions.length} · ${esc(q.type)}</div><div class="question">${esc(q.question)}</div>${q.options.map((o,i)=>`<label class="option ${state.answers[state.index]===i?'selected':''}"><input type="radio" name="answer" value="${i}" ${state.answers[state.index]===i?'checked':''} onchange="choose(${i})"><span><b>${'ABCD'[i]}.</b> ${esc(o)}</span></label>`).join('')}<div class="actions"><button class="btn secondary" onclick="move(-1)" ${state.index===0?'disabled':''}>← Câu trước</button><button class="btn secondary" onclick="move(1)" ${state.index===state.questions.length-1?'disabled':''}>Câu tiếp →</button><button class="btn" onclick="submitQuiz()">Nộp bài</button></div><div class="numbers" aria-label="Chuyển nhanh câu hỏi">${state.questions.map((_,i)=>`<button class="num ${state.index===i?'current':state.answers[i]!==null?'done':''}" onclick="go(${i})" aria-label="Đến câu ${i+1}">${i+1}</button>`).join('')}</div>`}
function choose(i){state.answers[state.index]=i;render()}function move(n){state.index=Math.max(0,Math.min(state.questions.length-1,state.index+n));render()}function go(i){state.index=i;render()}
function submitQuiz(){const missing=state.answers.filter(a=>a===null).length;if(missing&&!confirm(`Còn ${missing} câu chưa trả lời. Cô/em vẫn muốn nộp bài?`))return;state.result=true;const correct=state.questions.filter((q,i)=>state.answers[i]===q.answerIndex).length;const score=Math.round(correct/state.questions.length*1000)/100;const list=readHistory();list.unshift({date:new Date().toISOString(),mode:state.mode,correct,total:state.questions.length,score});saveHistory(list.slice(0,100));render()}
function resultView(){const correct=state.questions.filter((q,i)=>state.answers[i]===q.answerIndex).length;const score=(10*correct/state.questions.length).toFixed(2);return `<h2>🎉 Kết quả bài làm</h2><div class="score">${score}/10</div><p>Trả lời đúng <b>${correct}/${state.questions.length}</b> câu · Sai hoặc chưa trả lời: ${state.questions.length-correct} câu.</p><div class="actions"><button class="btn" onclick="startQuiz('${state.mode}')">Làm lại</button><button class="btn secondary" onclick="tab('home')">Trang chủ</button></div><h3>Đáp án và giải thích</h3>${state.questions.map((q,i)=>`<div class="review"><b>Câu ${i+1}:</b> ${esc(q.question)}<p class="${state.answers[i]===q.answerIndex?'correct':'wrong'}">Đã chọn: ${state.answers[i]===null?'Chưa trả lời':esc(q.options[state.answers[i]])}</p><p class="correct"><b>Đáp án đúng:</b> ${'ABCD'[q.answerIndex]}. ${esc(q.options[q.answerIndex])}</p><p class="mini">${esc(q.explanation)}</p></div>`).join('')}`}
const SITUATIONS=[['Nhập nhiệt độ đo được từ cảm biến vào máy tính.','Tiếp nhận dữ liệu'],['Máy tính tính trung bình nhiệt độ từ dữ liệu đã nhập.','Xử lí'],['Hiển thị nhiệt độ trung bình trên màn hình.','Đưa kết quả'],['Lưu dữ liệu nhiệt độ vào bộ nhớ.','Lưu trữ'],['Nhập ảnh chụp vào máy tính.','Tiếp nhận dữ liệu'],['Máy tính nén ảnh để giảm dung lượng.','Xử lí']];
function gameView(){const s=SITUATIONS[state.gameIndex];return `<h2>🎮 Trò chơi vận dụng</h2><p class="sub">Xác định giai đoạn xử lí thông tin trong từng tình huống.</p><p class="tag">Tình huống ${state.gameIndex+1}/${SITUATIONS.length} · Đúng ${state.gameScore}</p><div class="game-item">${esc(s[0])}</div><div class="controls"><label for="gameAnswer">Đây là bước nào?</label><select id="gameAnswer"><option value="">-- Chọn đáp án --</option>${['Tiếp nhận dữ liệu','Xử lí','Đưa kết quả','Lưu trữ'].map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select><button class="btn" onclick="checkGame()">Kiểm tra</button><button class="btn secondary" onclick="resetGame()">Chơi lại</button></div><p id="gameFeedback" role="status"></p>`}
function checkGame(){const v=$('gameAnswer').value;if(!v){$('gameFeedback').textContent='Hãy chọn một đáp án.';return}if(v===SITUATIONS[state.gameIndex][1]){state.gameScore++;if(state.gameIndex===SITUATIONS.length-1){$('gameFeedback').innerHTML=`<b class="correct">Hoàn thành! Đúng ${state.gameScore}/${SITUATIONS.length} tình huống. Nhấn Chơi lại để thử tiếp.</b>`;$('gameAnswer').disabled=true;return}state.gameIndex++;render();$('gameFeedback').innerHTML='<b class="correct">Chính xác! Đã chuyển sang tình huống tiếp theo.</b>'}else{$('gameFeedback').innerHTML='<b class="wrong">Chưa chính xác, hãy thử lại nhé!</b>'}}
function resetGame(){state.gameIndex=0;state.gameScore=0;render()}
function historyView(){const h=readHistory();return `<h2>📊 Lịch sử làm bài</h2><p class="sub">Kết quả chỉ lưu trên trình duyệt này, không tự động gửi cho giáo viên.</p>${!h.length?'<div class="empty">Chưa có lần làm bài nào được lưu.</div>':`<div style="overflow:auto"><table style="width:100%;border-collapse:collapse;text-align:left"><thead><tr><th>Thời gian</th><th>Hình thức</th><th>Số câu đúng</th><th>Điểm</th></tr></thead><tbody>${h.map(x=>`<tr style="border-top:1px solid #dbe5ef"><td style="padding:10px 4px">${esc(new Date(x.date).toLocaleString('vi-VN'))}</td><td>${x.mode==='demo'?'Đề minh họa':'Luyện tập'}</td><td>${x.correct}/${x.total}</td><td><b>${x.score}</b></td></tr>`).join('')}</tbody></table></div><div class="actions"><button class="btn secondary" onclick="downloadCSV()">Tải lịch sử CSV</button><button class="btn secondary" onclick="clearHistory()">Xóa lịch sử</button></div>`}`}
function clearHistory(){if(confirm('Xóa toàn bộ lịch sử làm bài lưu trên thiết bị này?')){saveHistory([]);render()}}
function downloadCSV(){const h=readHistory();const lines=[['Thoi gian','Hinh thuc','So cau dung','Tong so cau','Diem'],...h.map(x=>[new Date(x.date).toLocaleString('vi-VN'),x.mode==='demo'?'De minh hoa':'Luyen tap',x.correct,x.total,x.score])];const csv='\ufeff'+lines.map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lich-su-on-tap-tin10.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
render();
</script></body></html>
