pacity:.35;cursor:not-allowed}.btn.secondary{background:#e9f2f8;color:#175475}.counter{font-size:13px;color:#63798a}.question{border:1px solid #dbe6ef;border-radius:13px;padding:17px;margin:15px 0}.question h3{font-size:17px;line-height:1.5;margin:0 0 12px}.option{display:block;width:100%;text-align:left;padding:11px 13px;margin:7px 0;border:1px solid #d7e4ed;border-radius:10px;background:#fff;color:#233c4c}.option:hover:not(:disabled){background:#edf7fa}.option.chosen{border-color:#147e9a;background:#e4f5fa}.option.correct{border-color:#19885e;background:#e7f8ef}.option.wrong{border-color:#c34b4b;background:#ffeded}.feedback{font-size:14px;margin-top:10px;line-height:1.6}.small{font-size:14px;color:#567083}.progress{height:8px;background:#dce8f0;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:#2c98aa;transition:width .2s}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:10px;border:1px solid #d8e5ee;text-align:left}th{background:#eaf4fa}.pill{background:#f0f6fb;padding:6px 9px;border-radius:7px}.hide{display:none}ul,ol{line-height:1.85}footer{text-align:center;color:#667b8b;padding:14px 20px 25px;font-size:12px}@media(max-width:750px){.shell{display:block;margin:12px auto}.nav{position:static;display:flex;overflow:auto;gap:5px;margin-bottom:12px}.nav button{min-width:145px;margin:0;text-align:center;font-size:13px}.panel{min-height:450px}.arrow{display:none}.foot{flex-wrap:wrap}}
</style></head><body><header class="top"><div class="tag">TIN HỌC 11 • KẾT NỐI TRI THỨC</div><h1>Bài 10. Lưu trữ dữ liệu và khai thác thông tin phục vụ quản lí</h1><p>Bài giảng điện tử tương tác • Học trực tiếp trên trình duyệt</p></header><main class="shell"><nav class="nav" id="nav" aria-label="Các phần bài học"></nav><article class="panel"><div class="progress" aria-label="Tiến độ bài học"><div id="bar"></div></div><section id="content" aria-live="polite"></section><div class="foot"><button class="btn secondary" id="prev">← Quay lại</button><span class="counter" id="counter"></span><button class="btn" id="next">Tiếp theo →</button></div></article></main><footer>Học liệu tương tác phục vụ dạy và học Tin học 11 • Có thể nhúng vào Google Sites</footer><script>
'use strict';
const slides=[
{menu:'Khởi động',tag:'01 • KHỞI ĐỘNG',title:'Tình huống: Quản lí thư viện trường học',html:`<p class="lead">Thư viện có hàng nghìn cuốn sách và hàng trăm lượt mượn mỗi tháng. Nếu chỉ ghi chép trên giấy, thủ thư sẽ gặp khó khăn gì?</p><div class="example"><strong>Hãy suy nghĩ:</strong><ul><li>Làm thế nào biết một cuốn sách đang được ai mượn?</li><li>Làm thế nào tìm các học sinh trả sách quá hạn?</li><li>Khi có sách mới, làm thế nào cập nhật danh mục?</li></ul></div><div class="callout">💡 Nhu cầu quản lí đặt ra yêu cầu <strong>lưu trữ dữ liệu có tổ chức</strong> và <strong>khai thác thông tin</strong> nhanh, chính xác.</div>`},
{menu:'Mục tiêu',tag:'02 • MỤC TIÊU',title:'Sau bài học, em có thể…',html:`<ol><li>Nêu được vai trò của lưu trữ dữ liệu trong công việc quản lí.</li><li>Phân biệt dữ liệu được lưu trữ với thông tin thu được khi khai thác dữ liệu.</li><li>Nhận biết các thao tác thường gặp: thêm, sửa, xóa, tìm kiếm, lọc và thống kê.</li><li>Đề xuất cách tổ chức dữ liệu đơn giản cho một tình huống quản lí gần gũi.</li></ol><div class="callout">Từ khóa: <strong>dữ liệu – lưu trữ – cập nhật – tìm kiếm – thống kê – quản lí</strong>.</div>`},
{menu:'Lưu trữ dữ liệu',tag:'03 • KIẾN THỨC',title:'Vì sao cần lưu trữ dữ liệu?',html:`<p class="lead">Trong hoạt động quản lí, nhiều đối tượng và sự kiện cần được ghi nhận để theo dõi, cập nhật và tra cứu về sau.</p><div class="diagram"><div class="node">Thu thập dữ liệu</div><div class="arrow">→</div><div class="node">Lưu trữ có tổ chức</div><div class="arrow">→</div><div class="node">Khai thác thông tin</div><div class="arrow">→</div><div class="node">Hỗ trợ quyết định</div></div><div class="example"><strong>Ví dụ:</strong> Danh sách mượn sách có thể lưu mã học sinh, mã sách, ngày mượn, hạn trả và ngày trả thực tế.</div><div class="callout">Lưu trữ tốt giúp dữ liệu <strong>dễ tìm, dễ cập nhật, hạn chế nhầm lẫn</strong> và có thể sử dụng lại khi cần.</div>`},
{menu:'Dữ liệu quản lí',tag:'04 • KIẾN THỨC',title:'Dữ liệu trong một bài toán quản lí',html:`<p class="lead">Dữ liệu thường được tổ chức theo <strong>bản ghi</strong> (mỗi đối tượng hoặc giao dịch) và <strong>trường thông tin</strong> (mỗi đặc điểm cần quản lí).</p><div class="table-wrap"><table><thead><tr><th>Mã HS</th><th>Mã sách</th><th>Ngày mượn</th><th>Hạn trả</th><th>Ngày trả</th></tr></thead><tbody><tr><td>HS01</td><td>S102</td><td>03/11</td><td>10/11</td><td>09/11</td></tr><tr><td>HS02</td><td>S108</td><td>04/11</td><td>11/11</td><td>—</td></tr><tr><td>HS03</td><td>S102</td><td>12/11</td><td>19/11</td><td>—</td></tr></tbody></table></div><p class="small">Bảng trên là dữ liệu minh họa, không phải dữ liệu thật của học sinh.</p><div class="callout">Câu hỏi: Nếu muốn biết ai chưa trả sách, cần quan sát trường dữ liệu nào? <strong>Ngày trả</strong> là một trường quan trọng để kiểm tra.</div>`},
{menu:'Cập nhật dữ liệu',tag:'05 • KIẾN THỨC',title:'Cập nhật dữ liệu khi quản lí',html:`<p class="lead">Dữ liệu thay đổi theo thực tế. Vì vậy, người quản lí cần thực hiện các thao tác cập nhật.</p><div class="example"><p><strong>Thêm:</strong> Ghi một lượt mượn sách mới.</p><p><strong>Sửa:</strong> Điều chỉnh hạn trả khi có sai sót được xác nhận.</p><p><strong>Xóa:</strong> Loại bỏ bản ghi nhập nhầm theo quy định quản lí.</p></div><div class="callout">⚠️ Cần kiểm tra tính chính xác trước khi cập nhật; với dữ liệu quan trọng nên có phân quyền và sao lưu phù hợp.</div>`},
{menu:'Khai thác thông tin',tag:'06 • KIẾN THỨC',title:'Khai thác thông tin từ dữ liệu',html:`<p class="lead">Dữ liệu lưu trữ chỉ thực sự hữu ích khi được <strong>tìm kiếm, lọc, sắp xếp, tổng hợp hoặc thống kê</strong> để trả lời câu hỏi quản lí.</p><div class="example"><ul><li><strong>Tìm kiếm:</strong> Tra cứu lượt mượn của học sinh HS02.</li><li><strong>Lọc:</strong> Liệt kê các lượt mượn chưa có ngày trả.</li><li><strong>Sắp xếp:</strong> Xếp danh sách theo hạn trả tăng dần.</li><li><strong>Thống kê:</strong> Đếm số lượt mượn chưa hoàn tất.</li></ul></div><div class="diagram"><div class="node">Dữ liệu mượn sách</div><div class="arrow">→</div><div class="node">Lọc ngày trả còn trống</div><div class="arrow">→</div><div class="node">Danh sách chưa trả</div></div>`},
{menu:'Phân biệt',tag:'07 • VẬN DỤNG',title:'Dữ liệu và thông tin có gì khác?',html:`<div class="example"><strong>Dữ liệu:</strong> Các giá trị được ghi nhận trong bảng, ví dụ <span class="pill">HS02 – S108 – 04/11 – 11/11 – chưa trả</span>.</div><div class="example"><strong>Thông tin khai thác:</strong> “Trong bảng minh họa có <strong>2 lượt mượn chưa ghi nhận ngày trả</strong>.”</div><div class="callout">Cùng một tập dữ liệu có thể cung cấp nhiều thông tin khác nhau tùy câu hỏi: ai mượn, sách nào, còn bao nhiêu lượt chưa trả…</div><p class="small">Không nên kết luận “quá hạn” chỉ từ việc chưa có ngày trả; cần so sánh hạn trả với ngày đang xét.</p>`},
{menu:'Hoạt động nhóm',tag:'08 • HOẠT ĐỘNG',title:'Thiết kế bảng quản lí câu lạc bộ',html:`<p class="lead">Nhóm 3–4 học sinh thảo luận trong 4 phút:</p><ol><li>Chọn một đối tượng quản lí: thành viên câu lạc bộ Tin học.</li><li>Đề xuất ít nhất <strong>5 trường dữ liệu</strong> cần lưu.</li><li>Nêu <strong>2 thao tác cập nhật</strong> và <strong>2 câu hỏi khai thác thông tin</strong>.</li></ol><div class="example"><strong>Gợi ý sản phẩm:</strong> Mã thành viên, họ tên, lớp, ngày tham gia, nhóm hoạt động; tìm thành viên lớp 11A, thống kê số thành viên mỗi nhóm.</div><div class="callout">Tiêu chí đánh giá: trường dữ liệu phù hợp (4đ), cập nhật hợp lí (2đ), câu hỏi khai thác rõ ràng (4đ).</div>`},
{menu:'Kiểm tra nhanh',tag:'09 • LUYỆN TẬP',title:'Kiểm tra nhanh kiến thức',quiz:true},
{menu:'Tổng kết',tag:'10 • TỔNG KẾT',title:'Ghi nhớ và nhiệm vụ về nhà',html:`<div class="diagram"><div class="node">LƯU TRỮ<br><small>Ghi nhận và tổ chức</small></div><div class="arrow">→</div><div class="node">CẬP NHẬT<br><small>Thêm • Sửa • Xóa</small></div><div class="arrow">→</div><div class="node">KHAI THÁC<br><small>Tìm • Lọc • Thống kê</small></div></div><div class="callout"><strong>Thông điệp:</strong> Dữ liệu được tổ chức và cập nhật chính xác sẽ giúp khai thác thông tin phục vụ quản lí hiệu quả hơn.</div><div class="example"><strong>Nhiệm vụ về nhà:</strong> Chọn một hoạt động trong trường (quản lí thiết bị, sách, câu lạc bộ…), thiết kế bảng dữ liệu gồm ít nhất 5 trường và viết 3 câu hỏi có thể trả lời từ bảng đó.</div>`}
];
const questions=[
{q:'Mục đích quan trọng của việc lưu trữ dữ liệu trong quản lí là gì?',a:['Chỉ để trang trí báo cáo','Ghi nhận và sử dụng lại dữ liệu khi cần','Làm máy tính chạy nhanh hơn','Thay thế mọi quyết định của con người'],correct:1,why:'Dữ liệu được lưu trữ để tra cứu, cập nhật và khai thác về sau.'},
{q:'Thao tác nào là cập nhật dữ liệu?',a:['Thêm một lượt mượn sách mới','Đếm số lượt mượn','Tìm học sinh theo mã','Lọc danh sách chưa trả'],correct:0,why:'Thêm bản ghi mới là một thao tác cập nhật dữ liệu.'},
{q:'Muốn biết có bao nhiêu lượt mượn chưa ghi ngày trả, nên làm gì?',a:['Đổi tên bảng','Xóa tất cả bản ghi','Lọc các bản ghi chưa có ngày trả rồi đếm','In toàn bộ dữ liệu'],correct:2,why:'Lọc theo điều kiện và đếm cho ra thông tin cần thiết.'},
{q:'Trong bảng mượn sách, “Mã sách” thường là gì?',a:['Một trường dữ liệu','Một phần mềm','Một thiết bị lưu trữ','Một thao tác thống kê'],correct:0,why:'Mã sách là một thuộc tính/trường được lưu cho mỗi lượt mượn.'},
{q:'Phát biểu nào chính xác nhất?',a:['Chưa có ngày trả luôn có nghĩa là quá hạn','Dữ liệu không cần kiểm tra trước khi sửa','Một tập dữ liệu có thể phục vụ nhiều câu hỏi khai thác','Chỉ cần lưu dữ liệu, không cần cập nhật'],correct:2,why:'Có thể tìm kiếm, lọc, tổng hợp cùng dữ liệu theo nhiều mục đích; quá hạn còn phụ thuộc ngày xét.'}
];
let current=0,answers=Array(questions.length).fill(null);const nav=document.getElementById('nav'),content=document.getElementById('content');function render(){nav.innerHTML='';slides.forEach((s,i)=>{let b=document.createElement('button');b.textContent=s.menu;b.className=i===current?'active':'';b.setAttribute('aria-current',i===current?'step':'false');b.onclick=()=>go(i);nav.appendChild(b)});const s=slides[current];content.innerHTML=`<p class="tag">${s.tag}</p><h2>${s.title}</h2>${s.quiz?'<p class="lead">Chọn một đáp án cho mỗi câu. Sau khi trả lời, em sẽ nhận được phản hồi và lời giải thích.</p><div id="quiz"></div><div id="score"></div>':s.html}`;if(s.quiz)renderQuiz();document.getElementById('bar').style.width=((current+1)/slides.length*100)+'%';document.getElementById('counter').textContent=`${current+1} / ${slides.length}`;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1;document.getElementById('next').textContent=current===slides.length-2?'Đến tổng kết →':'Tiếp theo →'}function renderQuiz(){let el=document.getElementById('quiz');el.innerHTML='';questions.forEach((q,i)=>{let wrap=document.createElement('div');wrap.className='question';let h=document.createElement('h3');h.textContent=`Câu ${i+1}. ${q.q}`;wrap.appendChild(h);q.a.forEach((answer,j)=>{let b=document.createElement('button');b.className='option'+(answers[i]===j?' chosen':'');if(answers[i]!==null){if(j===q.correct)b.className+=' correct';else if(j===answers[i])b.className+=' wrong'}b.textContent=String.fromCharCode(65+j)+'. '+answer;b.disabled=answers[i]!==null;b.onclick=()=>{answers[i]=j;renderQuiz()};wrap.appendChild(b)});if(answers[i]!==null){let f=document.createElement('p');f.className='feedback';f.textContent=(answers[i]===q.correct?'✓ Chính xác. ':'✗ Chưa đúng. ')+q.why;wrap.appendChild(f)}el.appendChild(wrap)});let done=answers.filter(x=>x!==null).length,correct=answers.filter((x,i)=>x===questions[i].correct).length;let score=document.getElementById('score');score.innerHTML=`<div class="callout"><strong>Tiến độ:</strong> ${done}/${questions.length} câu đã trả lời${done===questions.length?` • <strong>Kết quả: ${correct}/${questions.length} câu đúng (${correct*10/questions.length}/10 điểm)</strong>`:''}</div>`;if(done>0){let reset=document.createElement('button');reset.className='btn secondary';reset.textContent='Làm lại câu hỏi';reset.onclick=()=>{answers.fill(null);renderQuiz()};score.appendChild(reset)}}function go(i){current=Math.max(0,Math.min(slides.length-1,i));render();window.scrollTo({top:0,behavior:'smooth'})}document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);render();
</script></body></html>
